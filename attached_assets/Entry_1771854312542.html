<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vanishing Student of Hogwarts</title>
    <style>
        body {

            background-image: url('Entry_Background.png');
            background-size: cover;
            /* Scales the image to cover the whole screen */
            background-position: center;
            /* Centers the image */
            background-attachment: fixed;
            /* Keeps the image still while scrolling */
            background-repeat: no-repeat;
        }

        :root {
            --gold: #eeba30;
            --gryffindor-red: #740001;
            --hogwarts-gold: #eeba30;
        }

        body {
            background-color: #1a1a1a;
            /* Dark dungeon background */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 91vh;
            justify-content: flex-end;

        }

        .wand-container {
            width: 687px;
            height: 17px;
            background: #2a2a2a;
            border: 2px solid var(--hogwarts-gold);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(238, 186, 48, 0.2);
            transition: opacity 0.5s ease;
        }

        .wand-progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--gryffindor-red), #ae0001);

            /* Initial state: shrunk to nothing on the X axis */
            transform: scaleX(0);
            transform-origin: left;
            transform-style: preserve-3d;

            /* The Transition: This makes the movement smooth */
            transition: transform 5s cubic-bezier(0.4, 0, 0.2, 1);

            box-shadow: 0 0 10px var(--hogwarts-gold);
        }
        .wand-progress:active{
            transform: scaleX(1);
        }

        .magic-glow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
            background: radial-gradient(circle, rgba(238, 186, 48, 0.8), transparent);
            filter: blur(8px);
            animation: glowPulse 4s infinite alternate;
        }
        @keyframes glowPulse {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 0.7;
            }

            100% {
                transform: translateX(-50%) scale(1.2);
                opacity: 1;
            }
        }
        /* Add a sparkling animation effect */
        .wand-progress::after {
            content: '';
            position: absolute;
            /* transform: scaleX(1); */
            top: 0;
            right: 0;
            width: 10px;
            height: 100%;
            background: white;
            filter: blur(5px);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: transparent;
            color: var(--hogwarts-gold);
            border: 1px solid var(--hogwarts-gold);
            cursor: pointer;
            font-family: 'serif';
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* 2. The Image Button (Hidden initially) */
        .image-button {
            opacity: 0;
            transform: scale(0.5); /* Starts small */
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none; /* Removed from flow initially */
            cursor: pointer;
            background: none;
            border: none;
        }
        .image-button img {
            width: 120px;
            filter: drop-shadow(0 0 10px var(--gold));
        }
        .image-button:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }

        /* State for when the button is revealed */
        .show-button {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        
    </style>
</head>

<body>
    <div class="wand-container" id="loader">
        <div class="wand-progress" id="progress"></div>
        <div class="magic-glow"></div>
    </div>
    <button id="magicBtn" class="image-button">
            <img src="play1.png" alt="Sorting Hat">
            <p>Enter Hogwarts</p>
    </button>

    <!-- <button onclick="castSpell()">Cast Spell</button> -->
    <!-- <main>
        <div class="dot"></div>
    </main>
    <footer>
   
    <div class="progress-container">
    <div class="progress-bar"></div>
    </div>
    
    </footer> -->

    <script>
        // function castSpell() {
        //     const bar = document.getElementById('progress');
        //     // Transform scaleX(1) means 100% width
        //     bar.style.transform = 'scaleX(1)';
        // }
         window.onload = function() {
            const fill = document.getElementById('progress');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('magicBtn');

            // 1. Start loading immediately on page load
            // A tiny timeout ensures the browser registers the 0 state before moving to 1
            setTimeout(() => {
                fill.style.transform = 'scaleX(1)';
            }, 100);

            // 2. After 4 seconds (duration of the bar transition)
            setTimeout(() => {
                // Fade out the loader
                loader.style.opacity = '0';
                
                // After fade out, swap the elements
                setTimeout(() => {
                    loader.style.display = 'none';
                    btn.classList.add('show-button');
                }, 500);
                
            }, 4100); 
        };
    </script>
</body>

</html>
